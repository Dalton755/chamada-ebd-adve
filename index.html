<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chamada EBD</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f3f4f6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
    width:120px;
    display:block;
    margin:0 auto 20px;
}

.titulo{
    text-align:center;
    font-size:28px;
    margin-bottom:20px;
    color:#111827;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#374151;
}

select,
input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:16px;
    outline:none;
    transition:.2s;
}

select:focus,
input:focus{
    border-color:#111827;
}

#lista{
    list-style:none;
    margin-top:10px;
}

#lista li{
    background:#f3f4f6;
    padding:12px;
    border-radius:10px;
    margin-bottom:5px;
    cursor:pointer;
    transition:.2s;
}

#lista li:hover{
    background:#e5e7eb;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#111827;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    opacity:.9;
}

.status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

    #validacao{

    margin-top:10px;
    font-weight:bold;
    text-align:center;
    padding:10px;
    border-radius:10px;
    display:none;

}

.valido{

    background:#dcfce7;
    color:#166534;

}

.invalido{

    background:#fee2e2;
    color:#991b1b;

}

button:disabled{

    opacity:.5;
    cursor:not-allowed;

}

</style>
</head>
<body>

<div class="card">

    <img src="LOGO.png" class="logo">

    <h1 class="titulo">Chamada EBD</h1>

    <label>Aula</label>
    <select id="aula"></select>

    <label style="margin-top:15px;">Nome do aluno</label>
    <input 
        type="text" 
        id="nome" 
        placeholder="Digite o nome"
        autocomplete="off"
    >
    
    <div id="validacao"></div>

    <ul id="lista"></ul>

    <button onclick="salvar()">
        Confirmar Presença
    </button>

    <div class="status" id="status"></div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbzZMVBxSVpORTJxWxa93m2pzNHTNiMRsQu1Zz0hGL9Npz0ivDuqY2MU9D52sFbIqhQhsQ/exec";

const inputNome = document.getElementById("nome");
const lista = document.getElementById("lista");
const selectAula = document.getElementById("aula");
const status = document.getElementById("status");
const validacao = document.getElementById("validacao");
const botao = document.querySelector("button");    
let timeoutValidacao;    


// ===============================
// CARREGAR AULAS
// ===============================

async function carregarAulas(){

    try{

        const req = await fetch(
            `${API}?acao=aulas`
        );

        const aulas = await req.json();

        selectAula.innerHTML = "";

        aulas.forEach(aula => {

            const option = document.createElement("option");

            option.value = aula.nome;
            option.innerText = aula.nome;

            selectAula.appendChild(option);

        });

    }catch(err){

        console.error(err);

        status.innerText = "Erro ao carregar aulas";

    }

}

carregarAulas();

selectAula.addEventListener("change", () => {

    validarAluno();

    atualizarContador();

});    


// ===============================
// AUTOCOMPLETE MEMBROS
// ===============================

inputNome.addEventListener("input", async () => {

    clearTimeout(timeoutValidacao);

    const nome = inputNome.value.trim();

    if(nome.length < 2){

        lista.innerHTML = "";

        validacao.style.display = "none";

        botao.disabled = false;

        return;

    }

    try{

        const req = await fetch(
            `${API}?acao=buscar&nome=${encodeURIComponent(nome)}`
        );

        const dados = await req.json();

        lista.innerHTML = "";

        dados.forEach(nomeEncontrado => {

            const li = document.createElement("li");

            li.innerText = nomeEncontrado;

            li.onclick = async () => {

                inputNome.value = nomeEncontrado;

                lista.innerHTML = "";

                clearTimeout(timeoutValidacao);

                await validarAluno();

            };

            lista.appendChild(li);

        });

    }catch(err){

        console.error(err);

    }

    timeoutValidacao = setTimeout(() => {

        validarAluno();

    }, 400);

});

async function validarAluno(){

    const nome = inputNome.value.trim();
    const aula = selectAula.value;

    if(nome.length < 2){

        validacao.style.display = "none";

        botao.disabled = false;

        return;

    }

    const req = await fetch(

        `${API}?acao=validar&nome=${encodeURIComponent(nome)}&aula=${encodeURIComponent(aula)}`

    );

    const dados = await req.json();

    if(dados.duplicado){

        validacao.style.display = "block";

        validacao.className = "invalido";

        validacao.innerText =
            "Aluno já possui presença hoje";

        botao.disabled = true;

    }else{

        validacao.style.display = "block";

        validacao.className = "valido";

        validacao.innerText =
            "Aluno elegível para chamada";

        botao.disabled = false;

    }

}
    

// ===============================
// SALVAR PRESENÇA
// ===============================

async function salvar(){

    const nome = inputNome.value.trim();
    const aula = selectAula.value;

    if(!nome){

        alert("Digite um nome");
        return;

    }

    if(!aula){

        alert("Selecione uma aula");
        return;

    }

    try{

        status.innerText = "Salvando presença...";

        const req = await fetch(API, {

            method:"POST",

            body:JSON.stringify({
                nome:nome,
                aula:aula
            })

        });

        const res = await req.json();

        if(!res.sucesso){

            status.innerText = res.mensagem;

            return;

        }

        if(res.sucesso){

            status.innerText = "Presença registrada com sucesso";

            inputNome.value = "";
            lista.innerHTML = "";
            validacao.style.display = "none";

validacao.innerText = "";

validacao.className = "";

botao.disabled = false;

        }else{

            status.innerText = "Erro ao salvar";

        }

    }catch(err){

        console.error(err);

        status.innerText = "Erro na conexão";

    }

}

</script>

</body>
</html>
